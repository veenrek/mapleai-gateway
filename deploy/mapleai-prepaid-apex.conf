<VirtualHost *:80>
    ServerName mapleai.shop
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} !https [NC]
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

    ProxyPreserveHost On
    ProxyPass /v1/ http://127.0.0.1:4031/api/v1/
    ProxyPassReverse /v1/ http://127.0.0.1:4031/api/v1/

    <Directory /var/www/html>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
