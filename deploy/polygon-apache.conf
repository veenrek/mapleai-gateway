<VirtualHost *:80>
    ServerName polygon.mapleai.shop
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:4024/
    ProxyPassReverse / http://127.0.0.1:4024/
RewriteEngine on
RewriteCond %{SERVER_NAME} =polygon.mapleai.shop
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
