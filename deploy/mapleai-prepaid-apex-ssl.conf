<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName mapleai.shop
    DocumentRoot /var/www/html

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto https
    ProxyPass /v1/ http://127.0.0.1:4031/api/v1/
    ProxyPassReverse /v1/ http://127.0.0.1:4031/api/v1/

    <Directory /var/www/html>
        AllowOverride None
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/mapleai.shop/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mapleai.shop/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
