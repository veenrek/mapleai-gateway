<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName mapleai.shop
    DocumentRoot /var/www/html

    # HTTP/2: requires mod_http2 and mpm_event (see deploy/README.md)
    Protocols h2 http/1.1

    KeepAlive On
    MaxKeepAliveRequests 100
    KeepAliveTimeout 5

    # Compress JSON responses. SSE streams are text/event-stream and are
    # intentionally excluded so chunks are never buffered by the filter.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/json application/problem+json
    </IfModule>
    <IfModule mod_headers.c>
        Header append Vary Accept-Encoding
    </IfModule>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto https
    ProxyPass /v1/health http://127.0.0.1:4031/api/health/ping
    ProxyPassReverse /v1/health http://127.0.0.1:4031/api/health/ping
    ProxyPass /v1/ http://127.0.0.1:4031/api/v1/
    ProxyPassReverse /v1/ http://127.0.0.1:4031/api/v1/
    ProxyPass /health http://127.0.0.1:4031/api/health/ping
    ProxyPassReverse /health http://127.0.0.1:4031/api/health/ping

    <Directory /var/www/html>
        AllowOverride None
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/mapleai.shop/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mapleai.shop/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
