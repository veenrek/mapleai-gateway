<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName polygon.mapleai.shop

    # HTTP/2: requires mod_http2 and mpm_event (see deploy/README.md)
    Protocols h2 http/1.1

    KeepAlive On
    MaxKeepAliveRequests 100
    KeepAliveTimeout 5

    # Compress JSON responses. SSE streams are text/event-stream and are
    # intentionally excluded so chunks are never buffered by the filter.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/json application/problem+json
    </IfModule>
    <IfModule mod_headers.c>
        Header append Vary Accept-Encoding
    </IfModule>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto https
    ProxyPass / http://127.0.0.1:4024/
    ProxyPassReverse / http://127.0.0.1:4024/

    SSLCertificateFile /etc/letsencrypt/live/polygon.mapleai.shop/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/polygon.mapleai.shop/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
