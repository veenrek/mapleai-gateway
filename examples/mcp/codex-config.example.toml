# Codex (OpenAI) MCP configuration — merge into ~/.codex/config.toml
# After saving: `codex mcp list` should show the mapleai server.
[mcp_servers.mapleai]
command = "npx"
args = ["-y", "-p", "mapleai-mcp", "mapleai-mcp"]
env = { EVM_PRIVATE_KEY = "0xYOUR_PRIVATE_KEY", MCP_PAY_TO_POLYGON = "0x63db6eaf635a31bbc6714fe37bdc85243864f611", MCP_MAX_PAYMENT_USDC = "0.10", MCP_MAX_PREPAID_USDC = "3.00" }

# For Base or Arc instead of Polygon, set EVM_PRIVATE_KEY plus
# MCP_PAY_TO_BASE / MCP_PAY_TO_ARC = "0x63db6eaf635a31bbc6714fe37bdc85243864f611".
# For Solana: SVM_PRIVATE_KEY = "your-base58-key", MCP_PAY_TO_SOLANA = "9DbpH2Mf9D26ak4bASsv6KA4Ra4V571oLpiVdZjAjcU8".
# Verify recipients against the domain's /.well-known/x402 manifest before funding a wallet.

# Windows note: if npx is not found, wrap it:
# command = "cmd"
# args = ["/c", "npx", "-y", "-p", "mapleai-mcp", "mapleai-mcp"]
